name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [ingestion, ml, dashboard-api, tier2_reasoner]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: ${{ matrix.module }}/requirements.txt
      - name: Install dependencies
        run: pip install -r ${{ matrix.module }}/requirements.txt
      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: python -m pytest -q

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r ingestion/requirements.txt -r ml/requirements.txt
      - name: Run feature-parity test
        run: python -m pytest -q integration/test_feature_parity.py
